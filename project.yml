name: Hourlark
options:
  bundleIdPrefix: com.ryanhamilton
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
targets:
  Hourlark:
    type: application
    platform: iOS
    sources:
      - Hourlark
      - Shared
    dependencies:
      - target: HourlarkWidgets
    info:
      path: Hourlark/Info.plist
      properties:
        CFBundleDisplayName: Hourlark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Hourlark uses the camera to scan your signed sheets. Photos stay on this iPhone.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # Makes Documents/ visible in the Files app under On My iPhone > Hourlark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Shows an "Hourlark" folder in iCloud Drive
        NSUbiquitousContainers:
          iCloud.com.ryanhamilton.hourlark:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Hourlark
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Hourlark/Hourlark.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ryanhamilton.hourlark
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ryanhamilton.hourlark
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.ryanhamilton.hourlark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanhamilton.hourlark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  HourlarkWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HourlarkWidgets
      - Shared
    info:
      path: HourlarkWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hourlark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HourlarkWidgets/HourlarkWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ryanhamilton.hourlark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanhamilton.hourlark.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  HourlarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HourlarkTests
    dependencies:
      - target: Hourlark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanhamilton.hourlark.tests
        GENERATE_INFOPLIST_FILE: YES
